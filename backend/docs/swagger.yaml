basePath: /
definitions:
  CargoCalculationRequest:
    properties:
      base_capacity:
        example: 5000
        type: number
      character_id:
        example: 12345678
        type: integer
      module_bonuses:
        items:
          $ref: '#/definitions/ModuleBonusInput'
        type: array
      ship_type_id:
        example: 650
        type: integer
      skill_levels:
        $ref: '#/definitions/SkillLevelsInput'
    required:
    - ship_type_id
    type: object
  CargoCalculationResponse:
    properties:
      base_capacity_m3:
        example: 5000
        type: number
      capacity_breakdown:
        example: 'Base: 5000m³ + Skills: 25% + Modules: 4656.9m³ = 9656.9m³'
        type: string
      effective_capacity_m3:
        example: 9656.9
        type: number
      module_bonus_m3:
        example: 4656.9
        type: number
      ship_type_id:
        example: 650
        type: integer
      ship_type_name:
        example: Nereus
        type: string
      skill_bonus_percent:
        example: 25
        type: number
    type: object
  CharacterFittingResponse:
    properties:
      align_time_seconds:
        description: Deterministic align time (with skills + modules)
        example: 4.82
        type: number
      applied_skills:
        example:
        - Gallente Hauler V
        - Navigation V
        items:
          type: string
        type: array
      base_cargo_hold_m3:
        example: 2700
        type: number
      base_fuel_bay_m3:
        example: 0
        type: number
      base_warp_speed_au_s:
        example: 3
        type: number
      cached_until:
        example: "2025-11-12T11:00:00Z"
        type: string
      character_id:
        example: 12345678
        type: integer
      effective_cargo_m3:
        example: 9656.9
        type: number
      fitted_modules:
        example: 5
        type: integer
      inertia_modifier:
        example: 1
        type: number
      ship_name:
        example: Nereus
        type: string
      ship_type_id:
        example: 650
        type: integer
      warp_speed_au_s:
        example: 6.87
        type: number
    type: object
  CharacterSkill:
    properties:
      active_skill_level:
        example: 5
        type: integer
      skill_id:
        example: 3340
        type: integer
      skillpoints_in_skill:
        example: 256000
        type: integer
      trained_skill_level:
        example: 5
        type: integer
    type: object
  CharacterSkillsResponse:
    properties:
      cached_until:
        example: "2025-11-12T11:00:00Z"
        type: string
      character_id:
        example: 12345678
        type: integer
      skills:
        items:
          $ref: '#/definitions/CharacterSkill'
        type: array
      total_sp:
        example: 50000000
        type: integer
      unallocated_sp:
        example: 0
        type: integer
    type: object
  CompetitionInfo:
    properties:
      changes_per_hour:
        example: 42.5
        type: number
      source:
        description: '"live" | "baseline"'
        example: baseline
        type: string
    type: object
  ErrorResponse:
    properties:
      code:
        example: 400
        type: integer
      error:
        example: Invalid request
        type: string
      message:
        example: Detailed error message
        type: string
    type: object
  HaulingItem:
    properties:
      buy_price:
        type: number
      name:
        type: string
      profit:
        description: net profit for this position
        type: number
      profit_per_m3:
        type: number
      quantity:
        type: integer
      sell_price:
        type: number
      type_id:
        type: integer
      unit_volume:
        type: number
    type: object
  HaulingRequest:
    properties:
      avoid_low_sec:
        type: boolean
      capital:
        type: number
      cargo_capacity:
        description: 'Optional: selected ship instance''s effective cargo (m³). When
          >0, overrides the per-type recompute.'
        type: number
      max_routes:
        description: 0 = default 15
        type: integer
      origin_region_id:
        description: 0 = use character's current region
        type: integer
      ship_type_id:
        type: integer
    type: object
  HaulingResponse:
    properties:
      origin_region_id:
        type: integer
      regions_scanned:
        items:
          type: integer
        type: array
      routes:
        items:
          $ref: '#/definitions/HaulingRoute'
        type: array
      skills_applied:
        $ref: '#/definitions/SkillsApplied'
    type: object
  HaulingRoute:
    properties:
      buy_station_id:
        type: integer
      buy_station_name:
        type: string
      buy_system_name:
        type: string
      isk_per_hour:
        type: number
      items:
        items:
          $ref: '#/definitions/HaulingItem'
        type: array
      jumps:
        type: integer
      security_risk:
        description: '"safe" | "caution" | "danger"'
        type: string
      sell_station_id:
        type: integer
      sell_station_name:
        type: string
      sell_system_name:
        type: string
      total_capital:
        type: number
      total_profit:
        type: number
      total_volume:
        type: number
      travel_time_min:
        type: number
    type: object
  HealthResponse:
    properties:
      status:
        example: ok
        type: string
      timestamp:
        example: "2025-11-12T10:00:00Z"
        type: string
    type: object
  HubComparisonRequest:
    properties:
      type_id:
        example: 34
        type: integer
    type: object
  HubComparisonResult:
    properties:
      best_hub_region_id:
        example: 10000032
        type: integer
      hubs:
        items:
          $ref: '#/definitions/HubRow'
        type: array
      item_name:
        example: Tritanium
        type: string
      skills_applied:
        $ref: '#/definitions/SkillsApplied'
      type_id:
        example: 34
        type: integer
    type: object
  HubRow:
    properties:
      buy_price:
        example: 5.5
        type: number
      competition:
        $ref: '#/definitions/CompetitionInfo'
      daily_volume:
        example: 125000
        type: number
      has_data:
        example: true
        type: boolean
      hub_name:
        example: Jita
        type: string
      liquidity_score:
        example: 72
        type: integer
      net_margin_percent:
        example: 3.4
        type: number
      net_profit_per_unit:
        example: 0.18
        type: number
      region_id:
        example: 10000002
        type: integer
      region_name:
        example: The Forge
        type: string
      sell_price:
        example: 6.1
        type: number
      spread_percent:
        example: 10.9
        type: number
      system_id:
        example: 30000142
        type: integer
      tier:
        description: '"primary" | "secondary"'
        example: primary
        type: string
    type: object
  ItemSearchResult:
    properties:
      group_name:
        example: Mineral
        type: string
      name:
        example: Tritanium
        type: string
      type_id:
        example: 34
        type: integer
    type: object
  MarketDataStalenessResponse:
    properties:
      age_minutes:
        example: 15
        type: integer
      last_update:
        example: "2025-11-12T10:00:00Z"
        type: string
      refresh_allowed:
        example: true
        type: boolean
      region_id:
        example: 10000002
        type: integer
      region_name:
        example: The Forge
        type: string
      status:
        description: fresh, stale, very_stale
        example: fresh
        type: string
    type: object
  MarketOrderResponse:
    properties:
      duration:
        example: 90
        type: integer
      is_buy_order:
        example: false
        type: boolean
      issued:
        example: "2025-11-12T10:00:00Z"
        type: string
      location_id:
        example: 60003760
        type: integer
      min_volume:
        example: 1
        type: integer
      order_id:
        example: 123456789
        type: integer
      price:
        example: 5.5
        type: number
      range:
        example: region
        type: string
      system_id:
        example: 30000142
        type: integer
      type_id:
        example: 34
        type: integer
      volume_remain:
        example: 100000
        type: integer
      volume_total:
        example: 100000
        type: integer
    type: object
  ModuleBonusInput:
    properties:
      attribute_id:
        example: 38
        type: integer
      value:
        example: 500
        type: number
    type: object
  PortfolioItem:
    properties:
      buy_station_id:
        type: integer
      buy_station_name:
        type: string
      buy_system_name:
        description: 'Where to execute the haul: buy at the buy station, sell at the
          sell station.'
        type: string
      capital_used:
        type: number
      daily_profit:
        type: number
      isk_per_hour:
        description: net daily profit per hour of haul time
        type: number
      name:
        type: string
      roi_percent:
        description: daily_profit / capital_used * 100
        type: number
      sell_station_id:
        type: integer
      sell_station_name:
        type: string
      sell_system_name:
        type: string
      trips_per_day:
        type: number
      type_id:
        type: integer
      units:
        type: integer
    type: object
  PortfolioRequest:
    properties:
      capital:
        description: ISK budget
        type: number
      cargo_capacity:
        description: 'Optional: selected ship instance''s effective cargo (m³). When
          >0, overrides the per-type fitting recompute.'
        type: number
      liquidity_cap_pct:
        description: 0..100, max share of daily volume per item
        type: number
      max_item_pct:
        description: 0..100, max share of capital per item
        type: number
      region_id:
        type: integer
      sec_zones:
        description: '"high","low","null"'
        items:
          type: string
        type: array
      ship_type_id:
        type: integer
      time_budget_min:
        description: available trading minutes/day
        type: number
    type: object
  PortfolioResult:
    properties:
      diversification_score:
        description: 0..100
        type: integer
      items:
        items:
          $ref: '#/definitions/PortfolioItem'
        type: array
      skills_applied:
        $ref: '#/definitions/SkillsApplied'
      time_used_min:
        type: number
      total_capital_used:
        type: number
      total_daily_profit:
        type: number
    type: object
  RegionResponse:
    properties:
      region_id:
        example: 10000002
        type: integer
      region_name:
        example: The Forge
        type: string
    type: object
  SkillLevelsInput:
    properties:
      racial_cruiser:
        example: 5
        type: integer
      racial_destroyer:
        example: 5
        type: integer
      racial_frigate:
        example: 5
        type: integer
      spaceship_command:
        example: 5
        type: integer
    type: object
  SkillsApplied:
    properties:
      accounting:
        example: 5
        type: integer
      applied:
        example: true
        type: boolean
      broker_fee_rate:
        example: 0.015
        type: number
      broker_relations:
        example: 5
        type: integer
      sales_tax_rate:
        example: 0.025
        type: number
    type: object
  TypeResponse:
    properties:
      category_id:
        example: 4
        type: integer
      group_id:
        example: 18
        type: integer
      packaged_volume:
        example: 0.01
        type: number
      type_id:
        example: 34
        type: integer
      type_name:
        example: Tritanium
        type: string
      volume:
        example: 0.01
        type: number
    type: object
  VersionResponse:
    properties:
      build_time:
        example: "2025-11-12T10:00:00Z"
        type: string
      git_commit:
        example: abc123def
        type: string
      version:
        example: 0.1.0
        type: string
    type: object
  WarpCalculationRequest:
    properties:
      base_inertia:
        example: 0.57
        type: number
      base_mass:
        example: 12100000
        type: number
      base_warp_speed:
        example: 3
        type: number
      character_id:
        example: 12345678
        type: integer
      module_bonuses:
        items:
          $ref: '#/definitions/ModuleBonusInput'
        type: array
      ship_type_id:
        example: 650
        type: integer
      skill_levels:
        $ref: '#/definitions/WarpSkillLevelsInput'
    required:
    - ship_type_id
    type: object
  WarpCalculationResponse:
    properties:
      align_time_seconds:
        example: 4.25
        type: number
      base_inertia:
        example: 0.57
        type: number
      base_warp_speed_au_s:
        example: 3
        type: number
      effective_inertia:
        example: 0.456
        type: number
      effective_warp_speed_au_s:
        example: 4.5
        type: number
      inertia_bonus_percent:
        example: 20
        type: number
      ship_type_id:
        example: 650
        type: integer
      ship_type_name:
        example: Nereus
        type: string
      warp_speed_bonus_percent:
        example: 50
        type: number
      warp_speed_breakdown:
        example: 'Base: 3.0 AU/s + Skills: 50% = 4.5 AU/s'
        type: string
    type: object
  WarpSkillLevelsInput:
    properties:
      evasive_maneuvering:
        example: 5
        type: integer
      navigation:
        example: 5
        type: integer
      warp_drive_operation:
        example: 5
        type: integer
    type: object
  models.AssetItem:
    properties:
      location_id:
        type: integer
      location_name:
        type: string
      marketable:
        type: boolean
      name:
        type: string
      quantity:
        type: integer
      region_id:
        type: integer
      system_id:
        type: integer
      type_id:
        type: integer
    type: object
  models.AssetsResponse:
    properties:
      assets:
        items:
          $ref: '#/definitions/models.AssetItem'
        type: array
      cache_expires_at:
        type: string
      count:
        type: integer
    type: object
  models.OreRankRow:
    properties:
      best:
        type: string
      best_station_id:
        type: integer
      best_station_name:
        description: 'Where to act:'
        type: string
      best_station_system:
        description: reprocess station system
        type: string
      best_station_tax:
        type: number
      crystal_multiplier:
        description: per ore; 1.0 = no crystals used
        type: number
      cycle_minutes:
        description: fill + legs + stops
        type: number
      delta_isk_per_hour:
        type: number
      effective_isk_per_hour:
        description: 'Haul-downtime cycle (effective ISK/h, greedy one cycle from
          current system):'
        type: number
      estimate_reason:
        description: short reason, only when IsEstimate
        type: string
      fill_minutes:
        description: time to fill the hold
        type: number
      hull_yield_multiplier:
        description: 'Yield accuracy (hull role/skill bonus + best-case ore crystal):'
        type: number
      is_estimate:
        description: hull bonus / crystal not fully resolved
        type: boolean
      load_volume_m3:
        description: ore-hold m³ filled per load
        type: number
      market_loads:
        description: full ore-hold loads the Best path's best reachable order(s) can
          absorb (VolumeRemain cap); 0<x<1 means the best price won't even take one
          load
        type: number
      materials:
        description: per-mineral sell breakdown
        items:
          $ref: '#/definitions/models.RefineMaterial'
        type: array
      mining_m3_per_hour:
        type: number
      ore_name:
        type: string
      ore_type_id:
        type: integer
      raw_isk_per_hour:
        type: number
      raw_net_per_m3:
        type: number
      raw_sell:
        allOf:
        - $ref: '#/definitions/models.SellLocation'
        description: where to sell the raw ore
      refine_isk_per_hour:
        type: number
      refine_net_per_m3:
        type: number
      route_jumps:
        description: jumps over the cycle's legs
        type: integer
      sell_system_name:
        description: chosen sell hub (refine) / ore-sell system (raw)
        type: string
    type: object
  models.OreRankingRequest:
    properties:
      allow_low_sec:
        description: true = willing to operate in low-sec too
        type: boolean
      region_id:
        type: integer
    type: object
  models.OreRankingResponse:
    properties:
      no_mining_setup:
        type: boolean
      not_available_reason:
        description: set when no ores apply here
        type: string
      quarter:
        description: amarr|caldari|gallente|minmatar|""
        type: string
      region_id:
        type: integer
      rows:
        items:
          $ref: '#/definitions/models.OreRankRow'
        type: array
      system_security:
        description: current system, displayed sec
        type: number
    type: object
  models.RefineMaterial:
    properties:
      buy_price:
        type: number
      effective_qty:
        type: integer
      material_name:
        type: string
      material_type_id:
        type: integer
      sell:
        $ref: '#/definitions/models.SellLocation'
    type: object
  models.RouteCalculationRequest:
    properties:
      align_time:
        description: 'Optional: Deterministic align time in seconds (from fitting
          calculation)'
        example: 4.8
        type: number
      cargo_capacity:
        description: 'Optional: Override cargo capacity (m³)'
        example: 62500
        type: number
      include_volume_metrics:
        description: 'Optional: Whether to include volume metrics'
        example: false
        type: boolean
      max_liquidation_days:
        description: 'Optional: Maximum liquidation time (days)'
        example: 7
        type: number
      min_daily_volume:
        description: 'Optional: Minimum daily volume filter (items/day)'
        example: 100
        type: number
      region_id:
        description: Region ID (e.g., The Forge)
        example: 10000002
        type: integer
      ship_type_id:
        description: Ship type ID (e.g., Bestower)
        example: 649
        type: integer
      warp_speed:
        description: 'Optional: Deterministic warp speed in AU/s (from fitting calculation)'
        example: 4.2
        type: number
    type: object
  models.RouteCalculationResponse:
    properties:
      calculation_time_ms:
        type: integer
      cargo_capacity:
        type: number
      region_id:
        type: integer
      region_name:
        type: string
      routes:
        items:
          $ref: '#/definitions/models.TradingRoute'
        type: array
      ship_name:
        type: string
      ship_type_id:
        type: integer
      warning:
        type: string
    type: object
  models.SellLocation:
    properties:
      is_structure:
        type: boolean
      location_id:
        description: station/structure id — in-game waypoint target
        type: integer
      station_name:
        type: string
      system_name:
        type: string
    type: object
  models.SellOption:
    properties:
      buy_price:
        type: number
      has_data:
        type: boolean
      isk_per_hour:
        type: number
      jumps:
        type: integer
      region_id:
        type: integer
      region_name:
        type: string
      scope:
        description: '"hub" | "current_region"'
        type: string
      security_risk:
        description: '"safe" | "caution" | "danger"'
        type: string
      station_id:
        type: integer
      station_name:
        type: string
      system_name:
        type: string
      total_net:
        type: number
      travel_time_min:
        type: number
      unit_net:
        type: number
    type: object
  models.SellOptionsRequest:
    properties:
      avoid_low_sec:
        type: boolean
      location_id:
        type: integer
      quantity:
        type: integer
      type_id:
        type: integer
    type: object
  models.SellOptionsResponse:
    properties:
      best:
        $ref: '#/definitions/models.SellOption'
      name:
        type: string
      not_routable_reason:
        type: string
      options:
        items:
          $ref: '#/definitions/models.SellOption'
        type: array
      origin_system_id:
        type: integer
      quantity:
        type: integer
      skills_applied:
        $ref: '#/definitions/SkillsApplied'
      type_id:
        type: integer
    type: object
  models.TradingRoute:
    properties:
      base_cargo_capacity:
        description: Base capacity without skills
        type: number
      base_isk_per_hour:
        description: ISK/h without navigation skills
        type: number
      base_travel_time_seconds:
        description: Navigation Skills fields
        type: number
      broker_fees:
        description: Combined broker fees (buy + sell)
        type: number
      buy_broker_fee:
        description: 'Trading Fees fields (Issue #39)'
        type: number
      buy_price:
        type: number
      buy_security_status:
        type: number
      buy_station_id:
        type: integer
      buy_station_name:
        type: string
      buy_system_id:
        type: integer
      buy_system_name:
        type: string
      cargo_capacity:
        description: Total effective capacity (with skills + fitting)
        type: number
      cargo_used:
        description: Cargo fields
        type: number
      cargo_utilization:
        description: Percentage 0-100
        type: number
      daily_profit:
        description: Profit per day (net_profit / liquidation_days)
        type: number
      estimated_relist_fee:
        description: Estimated relist fee (sell broker fee)
        type: number
      fitting_bonus_m3:
        description: Fitting modules bonus (absolute m³)
        type: number
      gross_margin_percent:
        description: Gross profit margin %
        type: number
      gross_profit:
        description: Profit before fees
        type: number
      isk_per_hour:
        type: number
      item_name:
        type: string
      item_type_id:
        type: integer
      item_volume:
        type: number
      jumps:
        type: integer
      liquidation_days:
        description: Estimated days to sell inventory
        type: number
      min_route_security_status:
        description: Minimum security of all systems on route
        type: number
      net_profit:
        description: Total profit minus all fees
        type: number
      net_profit_percent:
        description: Net profit margin %
        type: number
      number_of_tours:
        description: Multi-tour fields
        type: integer
      profit_per_tour:
        type: number
      profit_per_unit:
        type: number
      quantity:
        type: integer
      round_trip_seconds:
        type: number
      sales_tax:
        description: Sales tax on sell orders
        type: number
      sell_broker_fee:
        description: Broker fee for sell order placement
        type: number
      sell_price:
        type: number
      sell_security_status:
        type: number
      sell_station_id:
        type: integer
      sell_station_name:
        type: string
      sell_system_id:
        type: integer
      sell_system_name:
        type: string
      skill_bonus_percent:
        description: Total skill bonus %
        type: number
      skilled_travel_time_seconds:
        description: Travel time with navigation skills applied
        type: number
      spread_percent:
        type: number
      time_improvement_percent:
        description: Percentage improvement from skills
        type: number
      total_fees:
        description: Sum of all trading fees
        type: number
      total_investment:
        description: Total ISK needed to purchase cargo (buy_price × quantity)
        type: number
      total_profit:
        type: number
      total_time_minutes:
        type: number
      travel_time_seconds:
        type: number
      volume_metrics:
        allOf:
        - $ref: '#/definitions/models.VolumeMetrics'
        description: 'Volume & Liquidity fields (Issue #53)'
    type: object
  models.VolumeMetrics:
    properties:
      daily_isk_turnover:
        description: Average daily ISK traded (volume × avg_price)
        type: number
      daily_volume_avg:
        description: 30-day average daily volume
        type: number
      data_days:
        description: Number of days of historical data available
        type: integer
      liquidity_score:
        description: 0-100 score based on volume stability
        type: integer
      region_id:
        type: integer
      type_id:
        type: integer
    type: object
host: localhost:8080
info:
  contact:
    email: support@example.com
    name: EVE-O-Provit Team
    url: https://github.com/Sternrassler/eve-o-provit
  description: |-
    REST API for EVE Online trading, manufacturing and profit optimization

    Features:
    - Intra-region trading route calculation
    - Character skills and ship fitting integration
    - Deterministic cargo/warp speed calculations
    - Market data caching with staleness tracking
    - EVE SSO authentication
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  title: EVE-O-Provit API
  version: 0.27.0
paths:
  /api/v1/calculations/cargo:
    post:
      consumes:
      - application/json
      description: |-
        Calculate effective cargo capacity including skill bonuses and module bonuses
        Supports both character-based (with ESI fetch) and manual skill input
        Returns deterministic breakdown of all bonuses applied
      parameters:
      - description: Cargo calculation parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/CargoCalculationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CargoCalculationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Calculate effective cargo capacity
      tags:
      - Calculations
  /api/v1/calculations/warp:
    post:
      consumes:
      - application/json
      description: |-
        Calculate effective warp speed, inertia modifier, and align time
        Includes skill bonuses and module effects with stacking penalties
        Returns deterministic breakdown of all bonuses applied
      parameters:
      - description: Warp calculation parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/WarpCalculationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/WarpCalculationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Calculate warp speed and align time
      tags:
      - Calculations
  /api/v1/character:
    get:
      description: Get authenticated character information
      produces:
      - application/json
      responses:
        "200":
          description: Character info with character_id, character_name, scopes, portrait_url
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get character info
      tags:
      - Character
  /api/v1/character/location:
    get:
      description: Get character's current location (solar system)
      produces:
      - application/json
      responses:
        "200":
          description: Location data with solar_system_id, station_id, structure_id
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get character location
      tags:
      - Character
  /api/v1/character/ship:
    get:
      description: Get character's current active ship
      produces:
      - application/json
      responses:
        "200":
          description: Ship data with ship_item_id, ship_name, ship_type_id, ship_type_name
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get current ship
      tags:
      - Character
  /api/v1/character/ships:
    get:
      description: Get list of all character's ships in current hangar
      produces:
      - application/json
      responses:
        "200":
          description: Array of ships with ship_item_id, ship_name, ship_type_id,
            ship_type_name
          schema:
            items:
              additionalProperties: true
              type: object
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get character ships
      tags:
      - Character
  /api/v1/character/wallet:
    get:
      description: Get the authenticated character's wallet balance in ISK (used to
        prefill ROI capital)
      produces:
      - application/json
      responses:
        "200":
          description: Object with balance (float, ISK)
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get character wallet balance
      tags:
      - Character
  /api/v1/characters/{characterId}/fitting/{shipTypeId}:
    get:
      description: |-
        Retrieve character's ship fitting with deterministic bonus calculations
        Calculates effective cargo capacity, warp speed with skills and modules
        Uses EVE dogma engine with stacking penalties
      parameters:
      - description: Character ID
        example: 12345678
        in: path
        name: characterId
        required: true
        type: integer
      - description: Ship Type ID
        example: 650
        in: path
        name: shipTypeId
        required: true
        type: integer
      - default: false
        description: Force cache refresh
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CharacterFittingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get character ship fitting
      tags:
      - Fitting
  /api/v1/characters/{characterId}/skills:
    get:
      description: |-
        Retrieve character skills from ESI with Redis caching
        Graceful degradation: Returns default skills (level 0) if ESI fails
      parameters:
      - description: Character ID
        example: 12345678
        in: path
        name: characterId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/CharacterSkillsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get character skills
      tags:
      - Character
  /api/v1/esi/ui/autopilot/waypoint:
    post:
      consumes:
      - application/json
      description: |-
        Set autopilot waypoint in EVE client via ESI UI API
        Requires scope: esi-ui.write_waypoint.v1
      parameters:
      - description: Waypoint request
        in: body
        name: request
        required: true
        schema:
          properties:
            add_to_beginning:
              type: boolean
            clear_other_waypoints:
              type: boolean
            destination_id:
              format: int64
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: Waypoint set successfully
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Set autopilot waypoint
      tags:
      - ESI UI
  /api/v1/esi/ui/openwindow/marketdetails:
    post:
      consumes:
      - application/json
      description: |-
        Opens the market window for a given type_id in the EVE client.
        Requires scope: esi-ui.open_window.v1
      parameters:
      - description: Type ID to open
        in: body
        name: request
        required: true
        schema:
          properties:
            type_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "204":
          description: Market details window opened
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Open market details window in EVE client
      tags:
      - ESI UI
  /api/v1/health:
    get:
      description: Check API and database health status
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HealthResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Health check
      tags:
      - Health
  /api/v1/items/search:
    get:
      description: Search for EVE Online items by name (fuzzy matching)
      parameters:
      - description: Search query (min 3 characters)
        in: query
        minLength: 3
        name: q
        required: true
        type: string
      - default: 20
        description: Maximum results (default 20, max 100)
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/ItemSearchResult'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Search EVE items
      tags:
      - Trading
  /api/v1/market/{region}/{type}:
    get:
      description: |-
        Retrieve market orders for a specific item type in a region
        Supports optional refresh from ESI (cached for 5 minutes)
      parameters:
      - description: Region ID
        example: 10000002
        in: path
        name: region
        required: true
        type: integer
      - description: Type ID
        example: 34
        in: path
        name: type
        required: true
        type: integer
      - default: false
        description: Force refresh from ESI
        in: query
        name: refresh
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/MarketOrderResponse'
            type: array
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get market orders
      tags:
      - Market
  /api/v1/market/staleness/{region}:
    get:
      description: |-
        Check how old the cached market data is for a region
        Status: fresh (<30min), stale (30-60min), very_stale (>60min)
      parameters:
      - description: Region ID
        example: 10000002
        in: path
        name: region
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/MarketDataStalenessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get market data staleness
      tags:
      - Market
  /api/v1/mining/ore-ranking:
    post:
      consumes:
      - application/json
      description: |-
        Given a region (or the character's current region) and a security band,
        ranks ores by net ISK per m³ and — when a mining ship is fitted — per hour,
        comparing selling the raw ore vs reprocessing + selling the materials.
      parameters:
      - description: Ore ranking parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.OreRankingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.OreRankingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Rank asteroid ores by raw-vs-refine net ISK for a region + security
        band
      tags:
      - Mining
  /api/v1/sde/regions:
    get:
      description: Get list of all EVE Online regions from SDE
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/RegionResponse'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List all EVE regions
      tags:
      - SDE
  /api/v1/trading/assets:
    get:
      description: Returns the character's assets aggregated by (type, location) with
        quantity.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.AssetsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: List owned items aggregated by type and location
      tags:
      - Trading
  /api/v1/trading/assets/sell-options:
    post:
      consumes:
      - application/json
      description: |-
        For a selected owned item, ranks instant-sell (taker) locations across the
        major hubs + the item's current region by net proceeds, with route info.
      parameters:
      - description: Selected item
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SellOptionsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SellOptionsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Rank taker sell locations for one owned item
      tags:
      - Trading
  /api/v1/trading/hauling/routes:
    post:
      consumes:
      - application/json
      description: |-
        From the character's current region + adjacent regions, finds cross-region
        arbitrage routes with an optimal per-trip cargo load (cargo + capital).
      parameters:
      - description: Hauling parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/HaulingRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HaulingResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Find profitable station→station hauling routes in the neighborhood
      tags:
      - Trading
  /api/v1/trading/hubs/compare:
    post:
      consumes:
      - application/json
      description: |-
        For a given item, compares buy/sell/spread, skill-adjusted net margin,
        volume and competition across Jita, Amarr, Dodixie, Rens, Hek.
      parameters:
      - description: Item to compare
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/HubComparisonRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/HubComparisonResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Compare an item's station-trading profitability across major hubs
      tags:
      - Trading
  /api/v1/trading/portfolio/optimize:
    post:
      consumes:
      - application/json
      description: |-
        Given region, ship, capital and time budget, suggests how to allocate
        capital across items (greedy, under liquidity + per-item caps).
      parameters:
      - description: Optimization parameters
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/PortfolioRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/PortfolioResult'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Optimize capital allocation across items for max daily profit
      tags:
      - Trading
  /api/v1/trading/routes/calculate:
    post:
      consumes:
      - application/json
      description: |-
        Calculate optimal intra-region trading routes with profit analysis
        Uses character skills and ship fitting for accurate cargo capacity
        Supports deterministic navigation parameters (warp_speed, align_time) from frontend fitting calculation
        Supports volume filtering for liquidity-based selection
      parameters:
      - description: Route calculation request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.RouteCalculationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Successfully calculated routes
          schema:
            $ref: '#/definitions/models.RouteCalculationResponse'
        "206":
          description: Partial results (timeout)
          schema:
            $ref: '#/definitions/models.RouteCalculationResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/ErrorResponse'
      security:
      - BearerAuth: []
      summary: Calculate trading routes
      tags:
      - Trading
  /api/v1/types/{id}:
    get:
      description: Retrieve detailed information about an EVE Online item type from
        SDE
      parameters:
      - description: Type ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/TypeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/ErrorResponse'
      summary: Get item type information
      tags:
      - SDE
  /api/v1/version:
    get:
      description: Get API version information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/VersionResponse'
      summary: API version
      tags:
      - Health
securityDefinitions:
  BearerAuth:
    description: 'EVE SSO Bearer Token. Format: "Bearer {token}"'
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
