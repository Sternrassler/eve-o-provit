# Self-deploying CD for the eve-o-provit backend.
#
# Trigger: pushing a SemVer tag (vX.Y.Z) — matches this repo's release convention
# (`make release VERSION=x.y.z` bumps CHANGELOG + creates the git tag). Builds and
# pushes the backend image to GHCR (tag = the git tag + latest), then runs the shared
# deploy-app.sh on the backend host, which recreates ONLY eve-o-provit-api.
#
# Prereq secret: BACKEND_SSH_KEY (private deploy key whose public part is in
# root@backend authorized_keys). GHCR auth uses the built-in GITHUB_TOKEN.
name: deploy

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/sternrassler/eve-o-provit-backend
  FRONTEND_IMAGE: ghcr.io/sternrassler/eve-o-provit-frontend
  APP_NAME: eveoprovit
  # Public NEXT_PUBLIC_* values, baked into the frontend bundle at build time.
  # Served same-origin as the API, so callback + cookies + CORS all resolve to one host.
  PUBLIC_API_URL: https://eveonline.sternrassler.de
  PUBLIC_CALLBACK_URL: https://eveonline.sternrassler.de/callback
  PUBLIC_EVE_CLIENT_ID: 4d0514c205af4e898b0569badd59a38e

jobs:
  build-push:
    runs-on: ubuntu-latest
    # Presence flag for the optional Docker Hub login below (secrets aren't
    # allowed in step `if:` directly, so surface it as a job env boolean).
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Authenticate to Docker Hub to lift the anonymous pull rate limit on
      # shared GH runners (the base-image pull that timed out the v0.34.0 deploy:
      # registry-1.docker.io context deadline exceeded). No-op until the
      # DOCKERHUB_USERNAME/DOCKERHUB_TOKEN secrets are set.
      - name: Log in to Docker Hub (optional, raises base-image pull limit)
        if: ${{ env.HAS_DOCKERHUB == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ github.ref_name }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=eve-o-provit-backend
          cache-to: type=gha,scope=eve-o-provit-backend,mode=max

  build-push-frontend:
    runs-on: ubuntu-latest
    env:
      HAS_DOCKERHUB: ${{ secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub (optional, raises base-image pull limit)
        if: ${{ env.HAS_DOCKERHUB == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ env.PUBLIC_API_URL }}
            NEXT_PUBLIC_EVE_CALLBACK_URL=${{ env.PUBLIC_CALLBACK_URL }}
            NEXT_PUBLIC_EVE_CLIENT_ID=${{ env.PUBLIC_EVE_CLIENT_ID }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=eve-o-provit-frontend
          cache-to: type=gha,scope=eve-o-provit-frontend,mode=max

  deploy:
    needs: [build-push, build-push-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy to backend host
        uses: appleboy/ssh-action@v1.2.5
        env:
          APP_NAME: ${{ env.APP_NAME }}
          TAG: ${{ github.ref_name }}
        with:
          host: 46.225.188.34
          username: root
          key: ${{ secrets.BACKEND_SSH_KEY }}
          envs: APP_NAME,TAG
          script: |
            set -euo pipefail
            /opt/apps/scripts/deploy-app.sh "$APP_NAME" "$TAG"
