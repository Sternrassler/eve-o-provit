name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: gofmt -l . | tee /dev/stderr | (! grep .)
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      # Docker-free unit lane: -tags=unit drops the `!unit` integration files,
      # -short makes the remaining testcontainers-based tests skip.
      # Full integration suite runs separately via `make test-be-int`.
      - name: Unit tests with coverage
        run: go test -race -short -tags=unit -coverprofile=cover.out ./...
      - name: Coverage summary
        run: |
          echo "### Backend Coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - name: Build api binary
        run: go build ./cmd/api

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Blocking: deps are current (x/crypto v0.52.0) and the build/runtime use Go 1.26,
      # so stdlib CVEs are covered. A new advisory failing this job is the intended signal.
      - name: Scan
        run: govulncheck ./...
