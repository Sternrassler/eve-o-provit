name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: gofmt -l . | tee /dev/stderr | (! grep .)
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      # Docker-free unit lane: -tags=unit drops the `!unit` integration files,
      # -short makes the remaining testcontainers-based tests skip.
      # Full integration suite runs separately via `make test-be-int`.
      - name: Unit tests with coverage
        run: go test -race -short -tags=unit -coverprofile=cover.out ./...
      - name: Coverage summary
        run: |
          echo "### Backend Coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - name: Build api binary
        run: go build ./cmd/api

  vuln:
    runs-on: ubuntu-latest
    # Report-only: dependency CVEs are fixed in go.mod, but govulncheck also flags
    # stdlib CVEs tied to the Go toolchain patch level (prod builds on Go 1.24).
    # Surfacing those should not hard-block the pipeline. Follow-up: bump the prod
    # Dockerfile to Go 1.26 and flip this to blocking.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan
        run: govulncheck ./...
