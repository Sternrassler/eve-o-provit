name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: gofmt -l . | tee /dev/stderr | (! grep .)
      - name: go vet
        run: go vet ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      # Docker-free unit lane: -tags=unit drops the `!unit` integration files,
      # -short makes the remaining testcontainers-based tests skip.
      # Full integration suite runs separately via `make test-be-int`.
      - name: Unit tests with coverage
        run: go test -race -short -tags=unit -coverprofile=cover.out ./...
      - name: Coverage summary
        run: |
          echo "### Backend Coverage" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=cover.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
      - name: Build api binary
        run: go build ./cmd/api

  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      # Report-only (step-level continue-on-error keeps the check green): findings are
      # mostly stdlib CVEs tied to the Go 1.24 toolchain patch level + one test-path
      # dependency (x/crypto via testcontainers). Follow-up: bump to Go 1.26 + x/crypto
      # v0.52.0 (requires Go 1.25+) and flip this to blocking.
      - name: Scan
        continue-on-error: true
        run: govulncheck ./...
